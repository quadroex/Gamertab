name: gamertab
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: gamertab
      POSTGRES_USER: gamertab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run dev.ps1 up first}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamertab -d gamertab"]
      interval: 3s
      timeout: 3s
      retries: 20
  storage:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --location /data --silent
    ports:
      - "127.0.0.1:10000:10000"
      - "127.0.0.1:10001:10001"
    volumes:
      - queues:/data
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all([10000,10001].map(port=>new Promise((resolve,reject)=>{const c=require('net').connect(port,'127.0.0.1');c.once('connect',()=>{c.end();resolve()});c.once('error',reject)}))).then(()=>process.exit(0),()=>process.exit(1));"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    profiles: ["full"]
    build: .
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Gamertab: Host=db;Database=gamertab;Username=gamertab;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__QueueStorage: UseDevelopmentStorage=true;DevelopmentStorageProxyUri=http://storage
      NewsUpdates__Enabled: "true"
      Igdb__ClientId: ${IGDB_CLIENT_ID:-}
      Igdb__ClientSecret: ${IGDB_CLIENT_SECRET:-}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:5180:8080"
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
volumes:
  database:
  queues:
