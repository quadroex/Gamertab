name: Build and deploy Gamertab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gamertab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Gamertab.slnx
      - name: Test
        run: dotnet test Gamertab.slnx --configuration Release --no-restore --filter 'Category!=Browser' --verbosity minimal
      - name: Publish
        run: dotnet publish Gamertab/Gamertab.csproj --configuration Release --no-build --output publish
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: github.event_name != 'pull_request'
        with:
          name: gamertab-web
          path: publish
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AZURE_WEBAPP_NAME != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: gamertab-web
          path: publish
      - name: Sign in to Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy
        id: webapp
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish
      - name: Check deployed application
        env:
          APP_URL: ${{ steps.webapp.outputs.webapp-url }}
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 --max-time 60 "${APP_URL%/}/health"
